name: Verify Build (normal)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（默认取当前 tag 去 v 或 1.3.0）'
        required: false
        default: '1.3.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all flavors (release, unsigned)
        run: ./gradlew assembleRelease -P "version=${{ inputs.version }}"

      - name: List APK outputs
        run: |
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      # 上传产物便于直接安装/做免 Root 测试（单包通吃，仅 normal）
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: sure-xu-apks
          path: |
            app/build/outputs/apk/normal/release/*.apk
          if-no-files-found: error
